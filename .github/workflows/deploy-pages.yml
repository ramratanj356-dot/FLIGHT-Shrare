name: Deploy to GitHub Pages

# One-time setup (a token without the "Pages" permission cannot create the site via API,
# so this is a manual switch):  Settings → Pages → Source: "Deploy from a branch" →
# main / (root) → Save.
#
# After that, run this workflow from the Actions tab (or push to main — see the
# commented trigger below) and the site is redeployed.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled yet. Settings → Pages → Deploy from a branch → main / (root) → Save, then re-run this workflow."
          fi

      - name: Stage site
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' \
                    --exclude '_site' --exclude 'dist' --exclude 'tools' \
                    --exclude '*.zip' --exclude '*.log' \
                    ./ _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
